{
  "service": "nginx",
  "cert_root": "/cert",
  "fullchain_path": "{domain}.crt",
  "key_path": "{domain}.key",
  "verify": {
    "command": ["nginx", "-t"],
    "timeout": "30s"
  },
  "restart": {
    "type": "systemd",
    "name": "nginx",
    "reload_only": true
  },
  "install": {
    "mode": "symlink",
    "cert_name": "cert.pem",
    "key_name": "key.pem",
    "chain_name": "chain.pem",
    "fullchain_name": "fullchain.pem",
    "dir_mode": "0750",
    "key_mode": "0600",
    "cert_mode": "0644"
  }
}

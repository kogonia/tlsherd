{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.Title}} · TLS herd</title>
<link rel="stylesheet" href="/static/app.css">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body data-page="{{.Page}}"{{if .User}} data-role="{{.User.Role}}" data-login="{{.User.Login}}"{{end}}>
{{if .User}}
<header class="topbar">
  <a class="brand" href="/">TLS herd</a>
  <nav>
    {{$page := .Page}}
    {{range .Nav}}<a href="{{.Href}}"{{if eq .Page $page}} class="active" aria-current="page"{{end}}>{{.Label}}</a>{{end}}
  </nav>
  <div class="userbox">
    <a href="/account"{{if eq .Page "account"}} class="active"{{end}}>{{.User.Login}} <span class="badge">{{.User.Role}}</span></a>
    <button type="button" id="logout" class="link" hx-post="/api/v1/auth/logout" hx-swap="none">Sign out</button>
  </div>
</header>
{{end}}
<div id="toasts" aria-live="polite"></div>
<div id="secret"></div>
<main id="app" data-page="{{.Page}}" data-id="{{.ID}}">
  <h1>{{.Title}}</h1>
  {{template "content" .}}
</main>
<noscript><p class="error">This console needs JavaScript enabled.</p></noscript>
</body>
</html>
{{end}}

{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.Title}} · TLS herd</title>
<link rel="stylesheet" href="/static/app.css">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body data-page="{{.Page}}" class="nav-collapsed"{{if .User}} data-role="{{.User.Role}}" data-login="{{.User.Login}}"{{end}}>
{{if .User}}
<header class="topbar">
  <button type="button" class="nav-menu link" id="nav-menu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">Menu</button>
  <a class="brand" href="/">TLS herd</a>
  <div class="topbar-spacer"></div>
  <div class="userbox">
    <a href="/account"{{if eq .Page "account"}} class="active"{{end}}>{{.User.Login}} <span class="badge">{{.User.Role}}</span></a>
    <button type="button" id="logout" class="link" hx-post="/api/v1/auth/logout" hx-swap="none">Sign out</button>
  </div>
</header>
<div class="shell">
  <div class="nav-backdrop" id="nav-backdrop" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Main">
    <nav class="sidebar-nav">
      {{$page := .Page}}
      {{range .NavGroups}}
      <div class="nav-group">
        <div class="nav-group-label">{{.Label}}</div>
        {{range .Items}}
        <a href="{{.Href}}" class="nav-link{{if .IsActive $page}} active{{end}}"{{if .IsActive $page}} aria-current="page"{{end}} title="{{.Label}}">
          <span class="nav-abbr">{{.Abbr}}</span>
          <span class="nav-text">{{.Label}}</span>
        </a>
        {{end}}
      </div>
      {{end}}
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="nav-toggle link" id="nav-collapse" aria-label="Collapse sidebar" title="Collapse">«</button>
      <button type="button" class="nav-pin link" id="nav-pin" aria-pressed="false" aria-label="Pin sidebar open" title="Pin open">Pin</button>
    </div>
  </aside>
  <div class="content">
{{end}}
<div id="toasts" aria-live="polite"></div>
<div id="secret"></div>
<main id="app" data-page="{{.Page}}" data-id="{{.ID}}">
  <h1>{{.Title}}</h1>
  {{template "content" .}}
</main>
{{if .User}}
  </div>
</div>
{{end}}
<noscript><p class="error">This console needs JavaScript enabled.</p></noscript>
</body>
</html>
{{end}}
